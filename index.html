<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Hit Music | Booking & Agreement</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,rgba(212,175,55,.18),transparent 38%),linear-gradient(145deg,#050505,#111 55%,#000);color:#fff;font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:520px;text-align:center;padding:48px 28px 42px;border:1px solid #b88919;border-radius:18px;background:rgba(5,5,5,.94);box-shadow:0 0 35px rgba(212,175,55,.15);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#d4af37,transparent)}
.ornament{color:#d4af37;font-size:34px;margin-bottom:12px}
h1{margin:0;color:#d4af37;font-size:clamp(30px,8vw,48px);letter-spacing:3px}
h2{margin:8px 0 18px;font-size:17px;letter-spacing:4px;font-weight:normal;color:#f0e7c5}
p{color:#c9c9c9;line-height:1.7;font-family:Arial,sans-serif;font-size:14px;margin:0 auto 28px;max-width:390px}
.button{display:inline-block;text-decoration:none;color:#080808;background:linear-gradient(135deg,#f4d477,#b88919);padding:16px 28px;border-radius:8px;font-family:Arial,sans-serif;font-weight:bold;letter-spacing:1px;box-shadow:0 8px 22px rgba(212,175,55,.2)}
.small{margin-top:24px;margin-bottom:0;color:#777;font-size:12px}
.line{width:120px;height:1px;background:#8e6a1b;margin:22px auto}
</style>
</head>
<body>
<main class="card">
<div class="ornament">✦</div>
<h1>BOOKING</h1>
<h2>& AGREEMENT</h2>
<div class="line"></div>
<p>Welcome to the official booking page for private events. View the available appearance packages, booking terms and contact information.</p>
<a class="button" href="booking-agreement.jpg" target="_blank">VIEW BOOKING AGREEMENT</a>
<p class="small">BIG HIT MUSIC • PRIVATE EVENTS</p>
</main>
</body>
</html>
